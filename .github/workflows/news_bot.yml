name: Daily News Bot Execution (Jam 5 Sore WIB)

on:
  schedule:
    - cron: '0 10 * * *'  # Jam 10:00 UTC = Jam 17:00 (5 sore) WIB
  workflow_dispatch:      # Biar bisa diklik manual kapan aja

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI google-genai tavily-python

      - name: Run News Bot Script (Mode Cron)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: cron
        run: |
          python agent.py
